name: Daily Fork Synchronization

on:
  schedule:
    # Runs daily at 04:00 UTC (midnight EST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  sync-all-forks:
    name: Sync all SankofaForge forks with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Sync forks
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          echo "Fetching all forks in SankofaForge..."
          FORKS=$(gh repo list SankofaForge --limit 100 --json name,isFork --jq '.[] | select(.isFork) | .name')

          for repo in $FORKS; do
            echo "::group::Syncing SankofaForge/$repo"
            
            # Sync default branch
            echo "Syncing default branch..."
            if ! gh repo sync "SankofaForge/$repo"; then
              echo "::warning::Failed to sync default branch for $repo"
            fi

            # Handle secondary upstream tracking branches if they exist
            for branch in dev develop trunk gh-pages; do
              if gh api "repos/SankofaForge/$repo/branches/$branch" >/dev/null 2>&1; then
                echo "Syncing secondary branch: $branch..."
                gh repo sync "SankofaForge/$repo" -b "$branch" || true
              fi
            done

            echo "::endgroup::"
          done
